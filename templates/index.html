<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Agenda de Tarefas</h1>
            <p>Organize suas tarefas de forma simples e eficiente</p>
        </header>

        <main>
            <section class="form-section">
                <form id="taskForm">
                    <input 
                        type="text" 
                        id="taskTitle" 
                        placeholder="Título da tarefa" 
                        required
                    >
                    <textarea 
                        id="taskDescription" 
                        placeholder="Descrição (opcional)"
                    ></textarea>
                    <button type="submit" class="btn-add">➕ Adicionar Tarefa</button>
                </form>
            </section>

            <section class="tasks-section">
                <div id="tasksList" class="tasks-list"></div>
                <div id="emptyState" class="empty-state">
                    <p>Nenhuma tarefa ainda. Crie uma para começar!</p>
                </div>
            </section>
        </main>

        <footer>
            <p>Desenvolvido por Geovane Costa | Todos os diretios reservados</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
